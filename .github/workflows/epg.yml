name: EPG Update
on:
  push:
  schedule:
    - cron: '15 16,18,20,22,0,2,4,6,8,10,12,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update EPG Files
        run: |
          rm -f e.xml e.xml.gz
          wget -q https://raw.githubusercontent.com/suzukua/epg/refs/heads/hidden/t.xml -O e.xml
          gzip -9 -c e.xml > e.xml.gz
          ls -lh e.xml e.xml.gz
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add e.xml e.xml.gz
          if git diff --staged --quiet; then
            echo "EPG 没有变化，跳过提交"
          else
            git commit -m "EPG Update."
          fi
      - name: Push changes
        run: git push origin main
      - name: Purge jsDelivr cache
        run: |
          curl -sS "https://purge.jsdelivr.net/gh/zcyxa/tvlogo@main/e.xml" || true
          curl -sS "https://purge.jsdelivr.net/gh/zcyxa/tvlogo@main/e.xml.gz" || true