name: EPG Update
on:
  push:
    branches: [main]
  schedule:
    - cron: '15 16,18,20,22,0,2,4,6,8,10,12,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build EPG files
        run: |
          set -e
          wget -q https://raw.githubusercontent.com/suzukua/epg/refs/heads/hidden/t.xml -O /tmp/e.xml
          gzip -9 -c /tmp/e.xml > /tmp/e.xml.gz
          ls -lh /tmp/e.xml /tmp/e.xml.gz
      - name: Force push to data branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/e.xml /tmp/e.xml.gz .
          git add -A
          git commit -m "EPG update $(date -u -Iseconds)"
          git push --force origin data
      - name: Purge jsDelivr cache
        run: |
          curl -sS "https://purge.jsdelivr.net/gh/zcyxa/tvlogo@data/e.xml" || true
          curl -sS "https://purge.jsdelivr.net/gh/zcyxa/tvlogo@data/e.xml.gz" || true